# ==============================
# Flume ISS API Agent
# ==============================

# Agent components
ISSAgent.sources = ISSSource
ISSAgent.channels = MemChannel
ISSAgent.sinks = HDFS

# ==============================
# Source - Python API Script
# ==============================
ISSAgent.sources.ISSSource.type = exec
ISSAgent.sources.ISSSource.command = python /home/cloudera/fetch_iss.py
ISSAgent.sources.ISSSource.restart = true
ISSAgent.sources.ISSSource.restartThrottle = 5000
ISSAgent.sources.ISSSource.batchSize = 10

# ==============================
# Channel - Memory
# ==============================
ISSAgent.channels.MemChannel.type = memory
ISSAgent.channels.MemChannel.capacity = 10000
ISSAgent.channels.MemChannel.transactionCapacity = 100

# ==============================
# Sink - HDFS
# ==============================
ISSAgent.sinks.HDFS.type = hdfs
ISSAgent.sinks.HDFS.hdfs.path = hdfs://quickstart.cloudera:8020/iss_data
ISSAgent.sinks.HDFS.hdfs.fileType = DataStream
ISSAgent.sinks.HDFS.hdfs.writeFormat = Text
ISSAgent.sinks.HDFS.hdfs.batchSize = 10
ISSAgent.sinks.HDFS.hdfs.rollSize = 0
ISSAgent.sinks.HDFS.hdfs.rollCount = 100

# ==============================
# Source -> Channel
# Channel -> Sink
# ==============================
ISSAgent.sources.ISSSource.channels = MemChannel
ISSAgent.sinks.HDFS.channel = MemChannel